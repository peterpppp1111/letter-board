<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Letter Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700;800&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: a single departure-board panel, centred; mode tabs on top, flaps, typing tiles, ledger below. Deliberately dark-only. */
:root {
  --board: #14171c;
  --panel: #1d2129;
  --flap: #262b35;
  --seam: #0c0e12;
  --ink: #f3efe3;
  --muted: #8b93a3;
  --amber: #ffb84d;
  --good: #5fd08a;
  --bad: #ff6b6b;
  --display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body {
  background: var(--board);
  color: var(--ink);
  font-family: var(--body);
  font-size: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px 40px;
}
.wrap { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }

header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
h1 { font-family: var(--display); font-weight: 800; font-size: 2rem; letter-spacing: .04em; text-transform: uppercase; margin: 0; }
h1 span { color: var(--amber); }
.tagline { color: var(--muted); font-size: .95rem; margin: 0; }

/* mode tabs */
.modes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.modes a {
  display: flex; flex-direction: column; gap: 2px; padding: 12px 14px; border-radius: 8px;
  text-decoration: none; color: var(--muted); border: 2px solid #2c313b; background: transparent;
}
.modes a b { font-family: var(--display); font-weight: 700; font-size: 1.3rem; letter-spacing: .06em; text-transform: uppercase; color: var(--ink); }
.modes a span { font-size: .88rem; }
.modes a[aria-current="page"] { border-color: var(--amber); background: var(--panel); }
.modes a[aria-current="page"] b { color: var(--amber); }
.modes a:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }

.panel { background: var(--panel); border-radius: 10px; padding: 20px; display: flex; flex-direction: column; gap: 20px; box-shadow: 0 1px 0 #ffffff0d inset, 0 20px 40px #00000059; }

/* status row */
.status { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.stat { display: flex; flex-direction: column; gap: 2px; }
.stat .k { font-family: var(--mono); font-size: .7rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.stat .v { font-family: var(--display); font-weight: 700; font-size: 1.8rem; font-variant-numeric: tabular-nums; line-height: 1; }
.stat .v.low { color: var(--bad); }
.stat:nth-child(2), .stat:nth-child(3) { align-items: center; }
.stat:last-child { align-items: flex-end; }

/* the flaps: length + first letter, plus a second letter from question 21 */
.flaps { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.flaps.three { grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
.flaps.three .ch { font-size: clamp(3.4rem, 15vw, 6rem); }
.flapbox { display: flex; flex-direction: column; gap: 8px; align-items: center; }
.flapbox .k { font-family: var(--mono); font-size: .72rem; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
.flapbox .k.hot { color: var(--amber); }
.flap {
  position: relative; width: 100%; max-width: 180px; aspect-ratio: 4 / 5;
  background: var(--flap); border-radius: 8px; overflow: hidden;
  display: grid; place-items: center; perspective: 400px;
}
.flap::after { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 3px; background: var(--seam); transform: translateY(-1px); }
.flap .ch { font-family: var(--display); font-weight: 800; font-size: clamp(4.5rem, 22vw, 8rem); line-height: 1; color: var(--amber); text-transform: uppercase; font-variant-numeric: tabular-nums; }
.flap.flip .ch { animation: flip .38s cubic-bezier(.3,.7,.4,1); }
@keyframes flip { 0% { transform: rotateX(90deg); opacity: .2 } 60% { transform: rotateX(-12deg); opacity: 1 } 100% { transform: rotateX(0) } }

.rule { text-align: center; color: var(--muted); font-size: .98rem; margin: 0; text-wrap: balance; }
.rule b { color: var(--ink); font-weight: 600; }

/* typing tiles */
.entry { position: relative; display: flex; justify-content: center; }
.tiles { display: flex; gap: 6px; flex-wrap: nowrap; justify-content: center; max-width: 100%; }
.tile {
  width: clamp(28px, 9vw, 46px); aspect-ratio: 5 / 6; border-radius: 5px;
  background: var(--board); border: 2px solid #343a46;
  display: grid; place-items: center;
  font-family: var(--display); font-weight: 700; font-size: clamp(1.1rem, 5.5vw, 1.8rem); text-transform: uppercase;
  transition: border-color .15s;
}
.tile.fixed { color: var(--amber); border-color: #5a4a30; background: #2a2418; }
.tile.on { border-color: var(--ink); }
.tile.cur { border-color: var(--amber); }
.entry.good .tile { border-color: var(--good); color: var(--good); }
.entry.bad .tiles { animation: shake .32s; }
.entry.bad .tile { border-color: var(--bad); }
@keyframes shake { 20%,60% { transform: translateX(-6px) } 40%,80% { transform: translateX(6px) } }
#guess {
  position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; border: 0;
  font-size: 16px; caret-color: transparent; cursor: text;
}
.entry:focus-within .tiles { outline: 2px solid #ffb84d55; outline-offset: 6px; border-radius: 6px; }

.msg { min-height: 1.5em; text-align: center; font-size: 1rem; margin: 0; text-wrap: balance; }
.msg.good { color: var(--good); }
.msg.bad { color: var(--bad); }
.msg.info { color: var(--muted); }
.msg.alert { color: var(--amber); }

.controls { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
button {
  font-family: var(--display); font-weight: 700; font-size: 1.05rem; letter-spacing: .08em; text-transform: uppercase;
  border-radius: 6px; padding: 10px 18px; cursor: pointer; border: 2px solid transparent;
}
.primary { background: var(--amber); color: var(--seam); }
.primary:hover { filter: brightness(1.07); }
.ghost { background: transparent; color: var(--ink); border-color: #3a404c; }
.ghost:hover { border-color: var(--muted); }
button:disabled { opacity: .4; cursor: default; }
button:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }

/* difficulty */
.levels { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.levels .k { font-family: var(--mono); font-size: .7rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.seg { display: inline-flex; background: var(--board); border-radius: 6px; padding: 3px; gap: 3px; }
.seg button { font-family: var(--body); font-weight: 600; font-size: .9rem; letter-spacing: 0; text-transform: none; padding: 7px 14px; border: 0; background: transparent; color: var(--muted); border-radius: 4px; }
.seg button[aria-pressed="true"] { background: var(--flap); color: var(--ink); }
.levelnote { margin: 0; color: var(--muted); font-size: .88rem; text-align: center; text-wrap: balance; max-width: 46ch; }


/* ledger */
.ledger h2 { font-family: var(--mono); font-size: .72rem; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); font-weight: 500; margin: 0 0 10px; }
.ledger ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.ledger li { display: grid; grid-template-columns: 2.4em 5.8em 1fr auto; gap: 10px; align-items: baseline; padding: 6px 0; border-bottom: 1px solid #ffffff0f; font-variant-numeric: tabular-nums; }
.ledger .n { font-family: var(--mono); color: var(--muted); font-size: .8rem; }
.ledger .cue { font-family: var(--mono); color: var(--amber); font-size: .85rem; }
.ledger .w { font-family: var(--display); font-weight: 600; font-size: 1.15rem; letter-spacing: .03em; text-transform: uppercase; min-width: 0; overflow-wrap: anywhere; }
.ledger .w.miss { color: var(--muted); font-weight: 500; text-transform: none; font-family: var(--body); font-size: .95rem; }
.ledger .pts { font-family: var(--mono); font-size: .9rem; color: var(--good); }
.ledger .pts.zero { color: var(--muted); }
.ledger .empty { color: var(--muted); font-size: .95rem; margin: 0; }

@media (max-width: 420px) {
  .panel { padding: 16px 14px; }
  .tiles { gap: 4px; }
  .stat .v { font-size: 1.5rem; }
  .ledger li { grid-template-columns: 2em 5.2em 1fr auto; gap: 8px; }
}
@media (prefers-reduced-motion: reduce) {
  .flap.flip .ch, .entry.bad .tiles { animation: none; }
}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>Letter<span>Board</span></h1>
    <p class="tagline">Make a word that fits the board.</p>
  </header>

  <nav class="modes" aria-label="Game mode">
    <a href="#sprint" data-mode="sprint"><b>Sprint</b><span>Most points in 90 seconds</span></a>
    <a href="#survival" data-mode="survival"><b>Survival</b><span>15 seconds for every word</span></a>
  </nav>

  <section class="panel" aria-label="Game">
    <div class="status">
      <div class="stat"><span class="k">Question</span><span class="v" id="qnum">0</span></div>
      <div class="stat"><span class="k" id="scoreLabel">Score</span><span class="v" id="score">0</span></div>
      <div class="stat"><span class="k">Time</span><span class="v" id="time">90</span></div>
      <div class="stat"><span class="k">Best</span><span class="v" id="best">0</span></div>
    </div>

    <div class="flaps" id="flaps">
      <div class="flapbox"><span class="k">Letters</span><div class="flap" id="flapLen"><span class="ch" id="len">5</span></div></div>
      <div class="flapbox"><span class="k">Starts with</span><div class="flap" id="flapLet"><span class="ch" id="let">S</span></div></div>
      <div class="flapbox" id="secondBox" hidden><span class="k hot" id="secondLabel">4th letter</span><div class="flap" id="flapSecond"><span class="ch" id="second">E</span></div></div>
    </div>

    <p class="rule" id="rule">Type any <b>5-letter</b> word that starts with <b>S</b>.</p>

    <div class="entry" id="entry">
      <div class="tiles" id="tiles" aria-hidden="true"></div>
      <input id="guess" type="text" inputmode="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="Your word" disabled>
    </div>

    <p class="msg info" id="msg" aria-live="polite">Loading the dictionary…</p>

    <div class="controls">
      <button class="primary" id="startBtn" disabled>Start</button>
      <button class="ghost" id="skipBtn" disabled>Skip</button>
    </div>

    <div class="levels">
      <span class="k">Difficulty</span>
      <div class="seg" id="levelSeg" role="group" aria-label="Difficulty">
        <button data-v="easy" aria-pressed="false">Easy</button>
        <button data-v="advanced" aria-pressed="true">Advanced</button>
        <button data-v="hard" aria-pressed="false">Hard</button>
      </div>
      <p class="levelnote" id="levelNote"></p>
    </div>
  </section>

  <section class="ledger" aria-label="This game">
    <h2>This game</h2>
    <div id="ledger"><p class="empty">Your words appear here.</p></div>
  </section>
</div>

<script>
(() => {
  const MODES = {
    sprint:   { perWord: false, freeSkips: true,  scoreLabel: 'Score', bestUnit: 'points', start: 'Start 90-second round' },
    survival: { perWord: true,  freeSkips: false, scoreLabel: 'Words', bestUnit: 'words',  start: 'Start survival' },
  };
  // Each level deals boards by picking one random word from its list and reading its length and letter,
  // so boards follow that list's word distribution.
  const LEVELS = {
    easy:     { survival: 25, note: 'Boards follow how often words are used in everyday English, so short words come up most.' },
    advanced: { survival: 20, note: 'Boards follow the 30,000-word everyday list. Questions 1–5 use up to 5 letters, 6–10 up to 6, 11–15 up to 7, then anything from 3 to 9.' },
    hard:     { survival: 15, note: 'Boards follow all 72,000 accepted words, rare ones included, so long words come up most.' },
  };
  const SPRINT_TIME = 90;
  const TWO_LETTERS_AFTER = 20; // questions 1–20 give the first letter; from question 21 also a second letter at a random position
  const SKIP_EVERY = 10;     // every 10 correct answers earn one skip
  const DOUBLE_ENTER_MS = 1500; // pressing Enter twice on an empty box within this time uses a skip
  const MIN_ANSWERS = 4;     // only deal boards with at least this many answers in the level's list
  const advancedCap = q => q <= 5 ? 5 : q <= 10 ? 6 : q <= 15 ? 7 : 9;

  const $ = id => document.getElementById(id);
  const els = {
    qnum: $('qnum'), score: $('score'), scoreLabel: $('scoreLabel'), time: $('time'), best: $('best'),
    len: $('len'), let: $('let'), flapLen: $('flapLen'), flapLet: $('flapLet'),
    flaps: $('flaps'), secondBox: $('secondBox'), secondLabel: $('secondLabel'), second: $('second'), flapSecond: $('flapSecond'),
    rule: $('rule'), tiles: $('tiles'), entry: $('entry'), guess: $('guess'), msg: $('msg'),
    startBtn: $('startBtn'), skipBtn: $('skipBtn'), ledger: $('ledger'),
    levelSeg: $('levelSeg'), levelNote: $('levelNote'),
    modeLinks: document.querySelectorAll('.modes a'),
  };

  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  };

  let dict = null; // Set of every accepted word (answers are always checked against this)
  let P = null;    // per-level word lists, built when words.json loads
  const S = {
    mode: 'sprint', level: LEVELS[store.get('lb-level', '')] ? store.get('lb-level', '') : 'advanced',
    len: 5, fixed: [{ p: 0, c: 's' }], q: 0, score: 0, left: SPRINT_TIME, playing: false,
    used: new Set(), log: [], timer: null, lock: false, correct: 0, skips: 0, enterAt: 0,
  };
  const M = () => MODES[S.mode];
  const roundTime = () => S.mode === 'survival' ? LEVELS[S.level].survival : SPRINT_TIME;
  const bestKey = () => `lb-best-${S.mode}-${S.level}`;
  const ordinal = n => n + (n % 10 === 1 && n !== 11 ? 'st' : n % 10 === 2 && n !== 12 ? 'nd' : n % 10 === 3 && n !== 13 ? 'rd' : 'th');
  const helpText = () => (S.mode === 'sprint'
    ? `Score one point per letter in ${SPRINT_TIME} seconds.`
    : `Answer each board within ${roundTime()} seconds.`) +
    ' Questions 1–20 give the first letter; from question 21 you also get a second letter somewhere in the word.' +
    (S.mode === 'sprint'
      ? ' Skip as often as you like: press Skip, or press Enter twice with the box empty.'
      : ` Every ${SKIP_EVERY} correct answers earn a skip: press Skip, or press Enter twice with the box empty.`);

  // ---------- word lists ----------
  // Count how many words in a list fit each board: "length+first letter" and "length+first letter+position+second letter".
  const boardKey = (L, fixed) => L + fixed.map(f => f.c + f.p).join('');
  function indexBoards(list) {
    const m = new Map();
    const add = k => m.set(k, (m.get(k) || 0) + 1);
    for (const w of list) {
      const first = { p: 0, c: w[0] };
      add(boardKey(w.length, [first]));
      for (let p = 1; p < w.length; p++) add(boardKey(w.length, [first, { p, c: w[p] }]));
    }
    return m;
  }

  function buildLists(data) {
    dict = new Set();
    const split = part => Object.entries(data[part] || {}).flatMap(([L, s]) => +L >= 3 && +L <= 9 ? s.split(' ') : []);
    for (const part of ['common', 'all']) for (const s of Object.values(data[part])) s.split(' ').forEach(w => dict.add(w));

    // Easy: weighted by real-world usage
    const easy = [], cum = []; let total = 0;
    for (const item of split('freq')) {
      const i = item.lastIndexOf(':'); const w = item.slice(0, i);
      total += +item.slice(i + 1); easy.push(w); cum.push(total);
    }
    const freqRank = new Map(easy.map((w, i) => [w, cum[i] - (i ? cum[i - 1] : 0)]));

    // Advanced: everyday list, sorted by length so "up to N letters" is a prefix of the array
    const common = split('common').sort((a, b) => a.length - b.length);
    const capEnd = {}; for (let L = 3; L <= 9; L++) capEnd[L] = common.findIndex(w => w.length > L) === -1 ? common.length : common.findIndex(w => w.length > L);

    // Hard: every accepted word
    const all = common.concat(split('all'));

    P = {
      easy:     { list: easy, cum, total, idx: indexBoards(easy), freq: freqRank },
      advanced: { list: common, capEnd, idx: indexBoards(common) },
      hard:     { list: all, idx: indexBoards(all) },
      commonSet: new Set(common),
    };
  }

  const rand = n => Math.floor(Math.random() * n);

  function pickWord() {
    const lv = P[S.level];
    if (S.level === 'easy') {
      const r = Math.random() * lv.total;
      let lo = 0, hi = lv.cum.length - 1;
      while (lo < hi) { const mid = (lo + hi) >> 1; if (lv.cum[mid] > r) hi = mid; else lo = mid + 1; }
      return lv.list[lo];
    }
    if (S.level === 'advanced') return lv.list[rand(lv.capEnd[advancedCap(S.q)])];
    return lv.list[rand(lv.list.length)];
  }

  // ---------- dealing ----------
  const fits = (w, L, fixed) => w.length === L && fixed.every(f => w[f.p] === f.c);

  function openAnswers(L, fixed) {
    let n = P[S.level].idx.get(boardKey(L, fixed)) || 0;
    for (const u of S.used) if (fits(u, L, fixed)) n--;
    return n;
  }

  function deal() {
    S.q++;
    const prev = boardKey(S.len, S.fixed);
    // Every board comes from one real word. From question 21, also show one more of its letters at a random position.
    // If no two-letter board with enough answers turns up, fall back to a first-letter board.
    for (const two of S.q > TWO_LETTERS_AFTER ? [true, false] : [false]) {
      for (let tries = 0; tries < 300; tries++) {
        const w = pickWord();
        const L = w.length;
        const fixed = [{ p: 0, c: w[0] }];
        if (two) { const p = 1 + rand(L - 1); fixed.push({ p, c: w[p] }); }
        if (boardKey(L, fixed) === prev) continue;
        if (openAnswers(L, fixed) >= MIN_ANSWERS) { S.len = L; S.fixed = fixed; return; }
      }
    }
  }

  // ---------- typing ----------
  const fixedAt = p => S.fixed.find(f => f.p === p);
  const typedRaw = () => els.guess.value.toLowerCase().replace(/[^a-z]/g, '');

  // Lay the typed letters into the slots around the printed letters. Players may type a printed letter or skip it.
  function compose() {
    const v = typedRaw();
    const out = [];
    let i = 0;
    for (;;) {
      const f = fixedAt(out.length);
      if (f) { out.push(f.c); if (v[i] === f.c) i++; continue; }
      if (i >= v.length) break;
      out.push(v[i++]);
    }
    return out;
  }

  function currentWord() {
    // if the player typed the whole word themselves, trust that spelling
    const raw = typedRaw();
    if (fits(raw, S.len, S.fixed)) return raw;
    return compose().join('');
  }

  // ---------- rendering ----------
  function flip(el) { el.classList.remove('flip'); void el.offsetWidth; el.classList.add('flip'); }

  function boardText() {
    const [first, second] = S.fixed;
    let t = `Type any <b>${S.len}-letter</b> word that starts with <b>${first.c.toUpperCase()}</b>`;
    if (second) t += ` and has <b>${second.c.toUpperCase()}</b> as the <b>${ordinal(second.p + 1)}</b> letter`;
    return t + '.';
  }

  function renderBoard(animate) {
    const [first, second] = S.fixed;
    els.len.textContent = S.len;
    els.let.textContent = first.c.toUpperCase();
    els.secondBox.hidden = !second;
    els.flaps.classList.toggle('three', !!second);
    if (second) { els.second.textContent = second.c.toUpperCase(); els.secondLabel.textContent = `${ordinal(second.p + 1)} letter`; }
    els.rule.innerHTML = boardText();
    if (animate) {
      flip(els.flapLen); setTimeout(() => flip(els.flapLet), 90);
      if (second) setTimeout(() => flip(els.flapSecond), 180);
    }
    renderTiles();
  }

  function renderTiles() {
    const out = compose();
    const n = Math.max(S.len, out.length);
    // the cursor sits on the first empty slot that isn't a printed letter
    let cur = out.length; while (fixedAt(cur)) cur++;
    let html = '';
    for (let i = 0; i < n; i++) {
      const f = fixedAt(i);
      const ch = f ? f.c : (out[i] || '');
      const cls = ['tile'];
      if (f) cls.push('fixed'); else if (ch) cls.push('on');
      if (!f && i === cur && S.playing) cls.push('cur');
      html += `<div class="${cls.join(' ')}">${ch}</div>`;
    }
    els.tiles.innerHTML = html;
  }

  function say(text, kind) { els.msg.textContent = text; els.msg.className = `msg ${kind}`; }

  function renderStats() {
    els.qnum.textContent = S.q;
    els.scoreLabel.textContent = M().scoreLabel;
    els.score.textContent = S.score;
    els.time.textContent = S.left;
    els.time.classList.toggle('low', S.playing && S.left <= (M().perWord ? 5 : 10));
    els.best.textContent = store.get(bestKey(), 0);
  }

  function renderLedger() {
    if (!S.log.length) { els.ledger.innerHTML = '<p class="empty">Your words appear here.</p>'; return; }
    els.ledger.innerHTML = '<ol>' + S.log.slice().reverse().map(e => {
      const cue = `${e.len}·` + e.fixed.map(f => f.c.toUpperCase() + (f.p ? '@' + (f.p + 1) : '')).join(' ');
      const right = e.word
        ? `<span class="w">${e.word}</span><span class="pts">+${S.mode === 'sprint' ? e.word.length : 1}</span>`
        : `<span class="w miss">${e.why}. Could be: ${e.hints.join(', ')}</span><span class="pts zero">0</span>`;
      return `<li><span class="n">Q${e.q}</span><span class="cue">${cue}</span>${right}</li>`;
    }).join('') + '</ol>';
  }

  // Suggest answers the player is likely to know: the most-used words on Easy, everyday words otherwise.
  function hintsFor() {
    const ok = w => fits(w, S.len, S.fixed) && !S.used.has(w);
    const shuffle = a => a.sort(() => Math.random() - .5);
    let pick;
    if (S.level === 'easy') {
      const f = P.easy.freq;
      pick = P.easy.list.filter(ok).sort((a, b) => f.get(b) - f.get(a)).slice(0, 3);
    } else {
      const everyday = shuffle(P.advanced.list.filter(ok));
      pick = everyday.length >= 3 ? everyday.slice(0, 3)
        : everyday.concat(shuffle(P.hard.list.filter(w => ok(w) && !P.commonSet.has(w)))).slice(0, 3);
    }
    return pick.map(x => x.toUpperCase());
  }

  // ---------- play ----------
  function idle() {
    clearInterval(S.timer); S.playing = false; S.lock = false;
    els.guess.disabled = true;
    els.startBtn.textContent = M().start;
    renderSkip();
  }

  const canSkip = () => M().freeSkips || S.skips > 0;

  function renderSkip() {
    els.skipBtn.textContent = M().freeSkips ? 'Skip' : `Skip (${S.skips})`;
    els.skipBtn.disabled = !S.playing || !canSkip();
    els.skipBtn.title = canSkip() ? 'Skip this board. You can also press Enter twice with the box empty.' : `You earn a skip every ${SKIP_EVERY} correct answers.`;
  }

  function start() {
    if (!dict) return;
    S.score = 0; S.q = 0; S.used = new Set(); S.log = []; S.playing = true; S.lock = false;
    S.correct = 0; S.skips = 0; S.enterAt = 0;
    S.len = 0; S.fixed = [];
    S.left = roundTime();
    clearInterval(S.timer);
    S.timer = setInterval(tick, 1000);
    els.guess.disabled = false; renderSkip();
    els.startBtn.textContent = 'Restart';
    els.guess.value = '';
    deal(); renderBoard(true); renderStats(); renderLedger();
    say('Go! Press Enter to submit.', 'info');
    els.guess.focus();
  }

  function tick() {
    S.left--;
    renderStats();
    if (S.left <= 0) end(true);
  }

  function end(timedOut) {
    let note = '';
    if (M().perWord && timedOut) {
      const hints = hintsFor();
      S.log.push({ q: S.q, len: S.len, fixed: S.fixed, word: null, why: 'Out of time', hints });
      note = ` You could have played ${hints.join(', ')}.`;
    }
    idle();
    els.startBtn.textContent = 'Play again';
    const best = store.get(bestKey(), 0);
    const unit = S.score === 1 ? M().bestUnit.slice(0, -1) : M().bestUnit;
    if (S.score > best) { store.set(bestKey(), S.score); say(`Time! New best: ${S.score} ${unit}.${note}`, 'good'); }
    else say(`Time! You scored ${S.score} ${unit}.${note}`, 'info');
    renderStats(); renderTiles(); renderLedger();
  }

  function reject(text) {
    say(text, 'bad');
    els.entry.classList.remove('bad'); void els.entry.offsetWidth; els.entry.classList.add('bad');
  }

  function submit() {
    if (!S.playing || S.lock) return;
    // Enter on an empty box: the first press asks, a second press within 1.5 s uses a skip
    if (!typedRaw()) {
      const now = Date.now();
      if (canSkip() && now - S.enterAt < DOUBLE_ENTER_MS) { S.enterAt = 0; return skip(); }
      S.enterAt = now;
      if (M().freeSkips) return say('Press Enter again to skip this board.', 'alert');
      return S.skips
        ? say(`Press Enter again to use a skip (${S.skips} left).`, 'alert')
        : say(`No skips yet. You earn one every ${SKIP_EVERY} correct answers (${SKIP_EVERY - S.correct % SKIP_EVERY} to go).`, 'info');
    }
    S.enterAt = 0;
    const w = currentWord();
    if (w.length !== S.len) return reject(`That's ${w.length} letter${w.length === 1 ? '' : 's'}. You need ${S.len}.`);
    const wrong = S.fixed.find(f => w[f.p] !== f.c);
    if (wrong) return reject(wrong.p === 0
      ? `The word must start with ${wrong.c.toUpperCase()}.`
      : `The ${ordinal(wrong.p + 1)} letter must be ${wrong.c.toUpperCase()}.`);
    if (S.used.has(w)) return reject(`You already used ${w.toUpperCase()} this game.`);
    if (!dict.has(w)) return reject(`${w.toUpperCase()} isn't in the dictionary. Try another word.`);
    S.used.add(w);
    S.score += S.mode === 'sprint' ? w.length : 1;
    S.log.push({ q: S.q, len: S.len, fixed: S.fixed, word: w });
    if (M().perWord) S.left = roundTime();
    S.correct++;
    let earned = '';
    if (!M().freeSkips && S.correct % SKIP_EVERY === 0) { S.skips++; earned = ` ${S.correct} correct: you earned a skip (${S.skips} now).`; }
    say(`${w.toUpperCase()}: +${S.mode === 'sprint' ? w.length : 1}.${earned}`, 'good');
    renderSkip();
    els.entry.classList.add('good');
    S.lock = true;
    renderStats(); renderLedger();
    setTimeout(() => { els.entry.classList.remove('good'); S.lock = false; if (S.playing) next(); }, 260);
  }

  function next() {
    els.guess.value = '';
    deal(); renderBoard(true); renderStats();
    if (S.q === TWO_LETTERS_AFTER + 1) say('Question 21: from now on you also get a second letter somewhere in the word. Watch the gold tiles.', 'alert');
  }

  function skip() {
    if (!S.playing || S.lock) return;
    if (!canSkip()) return say(`No skips yet. You earn one every ${SKIP_EVERY} correct answers.`, 'info');
    if (!M().freeSkips) S.skips--;
    const hints = hintsFor();
    S.log.push({ q: S.q, len: S.len, fixed: S.fixed, word: null, why: 'Skipped', hints });
    if (M().perWord) S.left = roundTime(); // the next board gets the full time
    renderLedger(); renderSkip(); next();
    say(`Skipped. You could have played ${hints.join(', ')}.` + (M().freeSkips ? '' : ` Skips left: ${S.skips}.`), 'info');
    els.guess.focus();
  }

  // ---------- mode + settings ----------
  function setMode(mode) {
    if (!MODES[mode]) mode = 'sprint';
    S.mode = mode;
    els.modeLinks.forEach(a => { if (a.dataset.mode === mode) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
    idle();
    S.q = 0; S.score = 0; S.log = []; S.used = new Set(); S.left = roundTime(); S.correct = 0; S.skips = 0;
    if (P) { deal(); S.q = 0; renderBoard(true); say(helpText(), 'info'); }
    renderLevel(); renderStats(); renderLedger();
  }

  function renderLevel() {
    els.levelSeg.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === S.level)));
    const lv = LEVELS[S.level];
    els.levelNote.textContent = `${lv.note} Survival: ${lv.survival} seconds per word.`;
    document.querySelector('.modes a[data-mode="survival"] span').textContent = `${lv.survival} seconds for every word`;
  }

  els.levelSeg.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b || b.dataset.v === S.level) return;
    S.level = b.dataset.v; store.set('lb-level', S.level);
    setMode(S.mode);
  });

  window.addEventListener('hashchange', () => setMode(location.hash.slice(1)));

  // ---------- wire up ----------
  els.guess.addEventListener('input', () => {
    const clean = els.guess.value.replace(/[^a-zA-Z]/g, '').slice(0, S.len + 3);
    if (clean !== els.guess.value) els.guess.value = clean;
    els.entry.classList.remove('bad');
    renderTiles();
  });
  els.guess.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); submit(); }
    else if (e.key === 'Escape' && S.playing) { e.preventDefault(); skip(); }
  });
  els.startBtn.addEventListener('click', start);
  els.skipBtn.addEventListener('click', skip);

  setMode(location.hash.slice(1));

  fetch('words.json').then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }).then(data => {
    buildLists(data);
    deal(); S.q = 0; renderBoard(false); renderStats();
    els.startBtn.disabled = false;
    say(helpText(), 'info');
  }).catch(() => say('The dictionary did not load. Reload the page to try again.', 'bad'));
})();
</script>

</body>
</html>
